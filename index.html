<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10172a">
<meta name="description" content="Smart Calculator Pro — a responsive calculator with big integer support.">
<link rel="manifest" href="manifest.webmanifest">
<title>Smart Calculator Pro</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d32;--screen:#090f1d;--key:#263550;--key2:#344665;--text:#f5f7ff;--muted:#9aa9c2;--accent:#8b9cff;--green:#20c997;--red:#ef476f;--line:#293854;--shadow:0 24px 70px #0007}
*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:20px 14px;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 0%,#29366b 0,transparent 42%),linear-gradient(145deg,#080d19,#171d39 65%,#10172a);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
.app{width:min(100%,480px);padding:clamp(16px,4vw,24px);border:1px solid #ffffff17;border-radius:28px;background:linear-gradient(160deg,#19243b,#111a2e);box-shadow:var(--shadow);overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#8b9cff,#6957df);font-size:23px;box-shadow:0 8px 24px #7567ed55}h1{font-size:18px;letter-spacing:.1px;margin:0}.sub{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-top:4px}.iconbtn,.modebtn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:13px;min-height:42px;padding:0 12px;font-size:13px}
.display{padding:18px 16px 16px;border:1px solid #ffffff12;border-radius:20px;background:linear-gradient(145deg,#080e1b,#0d1628);margin-bottom:13px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end}
#expression{width:100%;border:0;outline:0;background:transparent;color:#c4cde0;text-align:right;font-size:clamp(18px,5vw,23px);font-family:inherit;min-height:38px}
#result{font-size:clamp(30px,8vw,42px);font-weight:750;text-align:right;overflow-wrap:anywhere;line-height:1.2;margin-top:9px;letter-spacing:-1px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 1px 14px}.status{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools,.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tools{margin-bottom:10px}.tools button{min-height:39px;font-size:12px;color:#cbd5e1}
button{font:inherit;cursor:pointer;touch-action:manipulation;user-select:none;border:0;color:var(--text);background:var(--key);border-radius:14px;min-height:54px;font-size:17px;font-weight:600;box-shadow:inset 0 1px #ffffff0d,0 3px 8px #0002;transition:transform .12s,filter .12s}
button:active{transform:scale(.96);filter:brightness(1.2)}.fn{background:#263653;color:#cbd7f2}.op{background:#35345f;color:#c9c3ff}.clear{background:#87334d}.equal{background:linear-gradient(135deg,#20c997,#13a982);color:#062b25;font-size:22px}.zero{grid-column:span 2}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}.section strong{font-size:13px}.section button{min-height:30px;padding:0 9px;font-size:11px;background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.history{max-height:130px;overflow:auto}.empty{font-size:12px;color:var(--muted);padding:8px 2px}.history-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #ffffff12;font-size:12px}.history-item span{min-width:0;overflow-wrap:anywhere;color:#b8c4da}.history-item button{min-height:30px;padding:0 10px;font-size:11px;box-shadow:none}
footer{text-align:center;color:#71819e;font-size:10px;line-height:1.6;margin-top:16px}
.light{color-scheme:light;--text:#182238;--muted:#65738b;--line:#dce3ef;--key:#e6ebf5;--key2:#d8e1f3;background:#f8fafc}
.light body{background:linear-gradient(145deg,#e8edff,#f8fafc)}.light .app{background:#fff;border-color:#e1e7f0}.light .display{background:#f3f6fc;border-color:#e3e9f3}.light #expression{color:#4a5870}.light .fn{background:#e5edfc;color:#35496e}.light .op{background:#eeeaff;color:#5548a5}.light .clear{color:white}.light .tools button{color:#46536b}.light .history-item{border-color:#e7ecf4}
@media(max-width:360px){body{padding:8px}.app{padding:13px;border-radius:22px}.keys{gap:6px}.keys button{min-height:48px;font-size:15px}.tools{gap:5px}.tools button{font-size:11px;padding:0 3px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app">
<header><div class="brand"><div class="logo">∑</div><div><h1>Smart Calculator</h1><div class="sub">PRO · BIG NUMBER MODE</div></div></div><button class="iconbtn" id="theme" aria-label="Toggle theme">☀️</button></header>
<section class="display"><input id="expression" aria-label="Math expression" placeholder="Type an expression…" autocomplete="off" spellcheck="false"><div id="result" aria-live="polite">0</div></section>
<div class="meta"><button class="modebtn" id="angle">DEG</button><span class="status" id="status">Exact whole-number mode ready</span><button class="modebtn" id="copy">Copy</button></div>
<div class="tools" id="memory"><button data-memory="MC">MC</button><button data-memory="MR">MR</button><button data-memory="M+">M+</button><button data-memory="M-">M−</button><button data-action="clear">AC</button></div>
<div class="keys" id="keys">
<button class="clear" data-action="clear">AC</button><button class="fn" data-action="back">⌫</button><button class="fn" data-insert="(">(</button><button class="fn" data-insert=")">)</button><button class="op" data-insert="/">÷</button>
<button class="fn" data-insert="sin(">sin</button><button class="fn" data-insert="cos(">cos</button><button class="fn" data-insert="tan(">tan</button><button class="fn" data-insert="sqrt(">√</button><button class="op" data-insert="*">×</button>
<button class="fn" data-insert="log(">log</button><button class="fn" data-insert="ln(">ln</button><button class="fn" data-insert="^2">x²</button><button class="fn" data-insert="^">xʸ</button><button class="op" data-insert="-">−</button>
<button data-insert="7">7</button><button data-insert="8">8</button><button data-insert="9">9</button><button class="fn" data-insert="%">%</button><button class="op" data-insert="+">+</button>
<button data-insert="4">4</button><button data-insert="5">5</button><button data-insert="6">6</button><button class="fn" data-insert="pi">π</button><button class="fn" data-insert="e">e</button>
<button data-insert="1">1</button><button data-insert="2">2</button><button data-insert="3">3</button><button class="fn" data-action="reciprocal">1/x</button><button class="fn" data-action="square-root">√x</button>
<button class="zero" data-insert="0">0</button><button data-action="decimal">.</button><button class="fn" data-action="sign">±</button><button class="equal" data-action="equals">=</button>
</div>
<div class="section"><strong>Recent calculations</strong><button id="clear-history">Clear history</button></div><div class="history" id="history"></div>
<footer>Offline-ready · Responsive touch interface · BigInt whole-number arithmetic<br>Scientific functions use standard JavaScript precision.</footer>
</main>
<script>
const $=id=>document.getElementById(id), expression=$("expression"),resultBox=$("result"),statusBox=$("status"),historyBox=$("history");
let memory=0,angleMode="DEG",history=JSON.parse(localStorage.getItem("sc-history")||"[]"),justEvaluated=false;
function status(s){statusBox.textContent=s}
function fmt(n){if(typeof n==="bigint")return n.toString();if(!Number.isFinite(n))throw Error("Result is outside supported numeric range");if(Math.abs(n)<1e-12)n=0;return Number(n.toPrecision(14)).toString()}
function tokenize(s){s=s.trim().replace(/[×]/g,"*").replace(/[÷]/g,"/").replace(/[−]/g,"-");if(!s)return[];if(s.length>100000)throw Error("Expression too long");const re=/\d+(?:\.\d*)?(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?|[a-zA-Z]+|[()+\-*/^%]/gy;let a=[],p=0;while(p<s.length){if(/\s/.test(s[p])){p++;continue}re.lastIndex=p;let m=re.exec(s);if(!m)throw Error("Invalid character");a.push(m[0]);p=re.lastIndex}return a}
function calc(source){const t=tokenize(source);if(!t.length)return 0;let i=0;const peek=()=>t[i],take=()=>t[i++];function primary(){const x=take();if(x===undefined)throw Error("Incomplete expression");if(x==="+")return unary();if(x==="-"){let v=unary();return -v}if(x==="("){let v=addSub();if(take()!==")")throw Error("Missing )");return v}if(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(x)){if(!/[.e]/i.test(x))return BigInt(x);let n=Number(x);if(!Number.isFinite(n))throw Error("Number too large");return n}const name=x.toLowerCase();if(name==="pi")return Math.PI;if(name==="e")return Math.E;if(["sin","cos","tan","sqrt","log","ln","abs"].includes(name)){if(take()!=="(")throw Error("Use "+name+"(...)");let v=Number(addSub());if(take()!==")")throw Error("Missing )");let a=angleMode==="DEG"?v*Math.PI/180:v,r;switch(name){case"sin":r=Math.sin(a);break;case"cos":r=Math.cos(a);break;case"tan":if(Math.abs(Math.cos(a))<1e-12)throw Error("Undefined tangent");r=Math.tan(a);break;case"sqrt":if(v<0)throw Error("Invalid square root");r=Math.sqrt(v);break;case"log":if(v<=0)throw Error("log needs positive number");r=Math.log10(v);break;case"ln":if(v<=0)throw Error("ln needs positive number");r=Math.log(v);break;case"abs":r=Math.abs(v)}return r}throw Error("Unknown value: "+x)}function postfix(){let v=primary();while(peek()==="%"){take();v=Number(v)/100}return v}function power(){let a=postfix();if(peek()==="^"){take();let b=unary();if(typeof a==="bigint"&&typeof b==="bigint"&&b>=0n&&b<=100000n)return a**b;a=Math.pow(Number(a),Number(b))}return a}function unary(){return power()}function mul(){let a=unary();while(peek()==="*"||peek()==="/"){let op=take(),b=unary();if(op==="*")a=typeof a==="bigint"&&typeof b==="bigint"?a*b:Number(a)*Number(b);else{if(Number(b)===0)throw Error("Cannot divide by zero");if(typeof a==="bigint"&&typeof b==="bigint"&&a%b===0n)a/=b;else a=Number(a)/Number(b)}}return a}function addSub(){let a=mul();while(peek()==="+"||peek()==="-"){let op=take(),b=mul();a=typeof a==="bigint"&&typeof b==="bigint"?(op==="+"?a+b:a-b):(op==="+"?Number(a)+Number(b):Number(a)-Number(b))}return a}let v=addSub();if(i!==t.length)throw Error("Check expression");if(typeof v==="number"&&!Number.isFinite(v))throw Error("Result out of range");return v}
function preview(){let s=expression.value.trim();if(!s){resultBox.textContent="0";status("Ready");return}try{resultBox.textContent=fmt(calc(s));status("Calculation ready")}catch(e){resultBox.textContent="…";status(e.message)}}
function insert(v){if(justEvaluated&&/^(?:\d|\.|pi$|e$|sin\(|cos\(|tan\(|sqrt\(|log\(|ln\()/.test(v))expression.value="";justEvaluated=false;let a=expression.selectionStart??expression.value.length,b=expression.selectionEnd??a;expression.setRangeText(v,a,b,"end");expression.focus();preview()}
function renderHistory(){historyBox.replaceChildren();if(!history.length){let d=document.createElement("div");d.className="empty";d.textContent="Your calculations will appear here.";historyBox.append(d);return}history.forEach(item=>{let row=document.createElement("div");row.className="history-item";let span=document.createElement("span");span.textContent=item.source+" = "+item.answer;let use=document.createElement("button");use.textContent="Use";use.addEventListener("click",()=>{expression.value=item.answer;justEvaluated=true;preview()});row.append(span,use);historyBox.append(row)})}
function evaluate(){try{let src=expression.value.trim();if(!src)return;let value=calc(src),answer=fmt(value);history.unshift({source:src,answer});history=history.slice(0,30);localStorage.setItem("sc-history",JSON.stringify(history));renderHistory();expression.value=answer;resultBox.textContent=answer;justEvaluated=true;status(typeof value==="bigint"?"Exact BigInt result":"Calculation complete")}catch(e){resultBox.textContent="Error";status(e.message)}}
function clearAll(){expression.value="";resultBox.textContent="0";justEvaluated=false;status("Ready to calculate");expression.focus()}
function backspace(){let a=expression.selectionStart??expression.value.length,b=expression.selectionEnd??a;if(a!==b)expression.setRangeText("",a,b,"end");else if(a>0)expression.setRangeText("",a-1,a,"end");justEvaluated=false;preview()}
$("keys").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.insert!==undefined){insert(b.dataset.insert);return}switch(b.dataset.action){case"clear":clearAll();break;case"back":backspace();break;case"equals":evaluate();break;case"decimal":insert(".");break;case"sign":insert("-");break;case"square-root":insert("sqrt(");break;case"reciprocal":insert("1/(");insert(")");break}});
$("memory").addEventListener("click",e=>{let a=e.target.dataset.memory;if(!a)return;try{if(a==="MC")memory=0;if(a==="MR")insert(String(memory));if(a==="M+")memory+=Number(calc(expression.value));if(a==="M-")memory-=Number(calc(expression.value));if(a!=="MR")status("Memory: "+memory)}catch{status("Enter a valid expression first")}});
expression.addEventListener("input",()=>{justEvaluated=false;preview()});expression.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();evaluate()}if(e.key==="Escape")clearAll()});
$("angle").addEventListener("click",e=>{angleMode=angleMode==="DEG"?"RAD":"DEG";e.currentTarget.textContent=angleMode;preview();status("Angle mode: "+angleMode)});
$("theme").addEventListener("click",()=>{document.documentElement.classList.toggle("light");localStorage.setItem("sc-light",document.documentElement.classList.contains("light")?"1":"0")});
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(resultBox.textContent);status("Result copied")}catch{status("Select result to copy")}});
$("clear-history").addEventListener("click",()=>{history=[];localStorage.removeItem("sc-history");renderHistory();status("History cleared")});
document.addEventListener("keydown",e=>{if(document.activeElement===expression)return;if(/^[0-9.+\-*/^()%]$/.test(e.key))insert(e.key);else if(e.key==="Enter")evaluate();else if(e.key==="Backspace")backspace();else if(e.key==="Escape")clearAll()});
if(localStorage.getItem("sc-light")==="1")document.documentElement.classList.add("light");renderHistory();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
